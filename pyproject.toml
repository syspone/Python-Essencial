[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-essencial"
version = "1.0.0"
description = "Aulas e exercícios do curso de Python"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Cristian Matias de Souza" }]

[project.scripts]
python-essencial = "python_essencial.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
# Mantém as aspas como foram escritas (as aulas alternam aspas simples e duplas de propósito)
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Nas aulas, imports de exemplo e nomes didáticos são intencionais
"aulas/*" = ["F401", "B018"]
